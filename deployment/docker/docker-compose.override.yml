# docker-compose.override.yml

# Development overrides for docker-compose.yml
# This file is automatically loaded by docker-compose

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DEV_MODE=true
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini
      # Persistent volumes
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - RELOAD=true
      - LOG_LEVEL=DEBUG
      - DB_ECHO=false
      - GENERATE_SAMPLE_DATA=true
    ports:
      - "8000:8000"
      - "5678:5678"  # Python debugger port
    command: >
      bash -c "
        echo 'Waiting for database...' &&
        python scripts/wait_for_db.py &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Initializing database...' &&
        python -m app.db.init_db --sample &&
        echo 'Starting development server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "

  db:
    ports:
      - "5432:5432"  # Expose PostgreSQL for local development
    environment:
      - POSTGRES_PASSWORD=ssa_password  # Override with dev password
    volumes:
      - ./deployment/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backups:/backups  # For easy backup/restore
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track=all
      -c log_statement='all'
      -c log_duration=on

  redis:
    ports:
      - "6379:6379"  # Expose Redis for local development
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --loglevel debug

  # Development tools
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@ssa.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    profiles:
      - dev-tools

  # Redis commander for Redis GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - dev-tools

  # Jupyter notebook for data analysis
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./app:/app/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis
    profiles:
      - dev-tools

  # Development documentation server
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      mkdocs serve
      --dev-addr=0.0.0.0:8082
    ports:
      - "8082:8082"
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml
    profiles:
      - dev-tools

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    profiles:
      - dev-tools

volumes:
  pgadmin_data:
  jupyter_data:

# To use dev tools, run:
# docker-compose --profile dev-tools up