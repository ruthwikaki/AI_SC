# docker-compose.yml

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ssa-db
    environment:
      POSTGRES_USER: ${DB_USER:-ssa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ssa_password}
      POSTGRES_DB: ${DB_NAME:-ssa_db}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployment/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups:/backups
    networks:
      - ssa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ssa_user} -d ${DB_NAME:-ssa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ssa-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-ssa_redis_password}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ssa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        - ENVIRONMENT=${ENVIRONMENT:-development}
    container_name: ssa-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-ssa_user}:${DB_PASSWORD:-ssa_password}@db:5432/${DB_NAME:-ssa_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ssa_redis_password}@redis:6379/0
      
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      
      # ML Service
      ML_SERVICE_URL: http://ml-service:8001
      
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      
      # Features
      ENABLE_AUDIT_LOG: ${ENABLE_AUDIT_LOG:-true}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - ssa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ML Service
  ml-service:
    build:
      context: .
      dockerfile: deployment/docker/ml.Dockerfile
      args:
        - ENVIRONMENT=${ENVIRONMENT:-development}
    container_name: ssa-ml-service
    environment:
      MODELS_DIR: /app/models
      CONFIG_DIR: /app/config
      DATABASE_URL: postgresql://${DB_USER:-ssa_user}:${DB_PASSWORD:-ssa_password}@db:5432/${DB_NAME:-ssa_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ssa_redis_password}@redis:6379/1
      MODEL_CACHE_DIR: /app/model_cache
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${ML_PORT:-8001}:8001"
    volumes:
      - model-data:/app/models
      - model-cache:/app/model_cache
      - ./ml_models:/app/ml_models:ro
      - ./config:/app/config:ro
    networks:
      - ssa-network
    deploy:
      resources:
        limits:
          memory: ${ML_MEMORY_LIMIT:-4G}
        reservations:
          memory: ${ML_MEMORY_RESERVATION:-2G}
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-development}
    container_name: ssa-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_NAME: ${APP_NAME:-Supply Chain Analytics}
      VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
    networks:
      - ssa-network
    restart: unless-stopped

  # Background Worker (Scheduler)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: ssa-worker
    command: python -m app.jobs.scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ssa_user}:${DB_PASSWORD:-ssa_password}@db:5432/${DB_NAME:-ssa_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ssa_redis_password}@redis:6379/0
      SCHEDULER_ENABLED: "true"
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./app:/app/app:ro
      - ./logs:/app/logs
    networks:
      - ssa-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ssa-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - ssa-network
    restart: unless-stopped

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ssa-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ssa-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ssa-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ssa-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Backup Service
  backup:
    build:
      context: .
      dockerfile: deployment/docker/backup.Dockerfile
    container_name: ssa-backup
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ssa_user}:${DB_PASSWORD:-ssa_password}@db:5432/${DB_NAME:-ssa_db}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    networks:
      - ssa-network
    profiles:
      - production
    restart: unless-stopped

networks:
  ssa-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  model-data:
    driver: local
  model-cache:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local