# Backend configuration for Supply Chain LLM

# Server settings
server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  reload: false
  debug: false

# LLM settings
llm:
  active_model: mistral
  models:
    - name: mistral
      type: api
      api_key: ${MISTRAL_API_KEY}
      base_url: https://api.mistral.ai/v1
      timeout: 60
      max_tokens: 4096
    - name: llama3
      type: local
      url: http://localhost:8001
      timeout: 120
      max_tokens: 4096

# Security settings
security:
  jwt_secret: ${JWT_SECRET}
  jwt_algorithm: HS256
  jwt_expiration: 3600  # 1 hour
  password_hash_rounds: 12
  admin_email: ${ADMIN_EMAIL}

# Database settings
database:
  url: ${DATABASE_URL}
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 1800

# Caching settings
cache:
  url: ${REDIS_URL}
  ttl: 3600  # 1 hour
  prefix: "supplychainllm:"

# Logging settings
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ${LOG_DIR}/backend.log
  max_size: 10485760  # 10 MB
  backup_count: 5

# Rate limiting
rate_limit:
  enabled: true
  default_limit: 100  # requests per minute
  token_limit: 200000  # tokens per hour