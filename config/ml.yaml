# ML configuration for Supply Chain LLM

# Server settings
server:
  host: 0.0.0.0
  port: 8001
  workers: 2
  threads: 4

# Model settings
models:
  - name: mistral
    path: ${MODELS_DIR}/mistral
    type: pytorch
    precision: fp16
    tokenizer: ${MODELS_DIR}/tokenizers/mistral.model
    max_batch_size: 8
    device: cuda:0
  - name: llama3
    path: ${MODELS_DIR}/llama3
    type: onnx
    precision: int8
    tokenizer: ${MODELS_DIR}/tokenizers/llama3.model
    max_batch_size: 4
    device: cuda:0

# Hardware settings
hardware:
  use_gpu: true
  tensor_cores: true
  cuda_visible_devices: 0
  memory_limit: 0.9  # Use up to 90% of GPU memory

# Performance settings
performance:
  cache_size: 1024  # Prompt cache size in MB
  prefill_buffers: true
  low_memory_mode: false
  quantization:
    enabled: true
    type: dynamic

# Logging settings
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ${LOG_DIR}/ml.log
  max_size: 10485760  # 10 MB
  backup_count: 5